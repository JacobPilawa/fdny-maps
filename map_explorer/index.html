<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FDNY maps</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="recording.css"><link rel="stylesheet" href="level-editor.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script></head><body>
<div id="app"><header><button id="sidebarToggle" class="icon" aria-label="Toggle object list" title="Object list">◧</button><select id="mapSelect" aria-label="Map"></select><span class="divider"></span><div class="seg"><button id="mode2d" disabled aria-label="2D view">2D</button><button id="mode3d" disabled class="active" aria-label="3D view">3D</button></div><button id="fly" hidden title="Toggle Fly · F" aria-keyshortcuts="F">Fly</button><button id="fit" class="icon" aria-label="Fit map" title="Fit map · F">⛶</button><button id="labels" class="icon active" aria-label="Toggle all labels" title="Labels · L">Aa</button><button id="uploadRecording">↑ Upload recording(s)</button><span class="spacer"></span><details id="toolsMenu"><summary aria-label="Map tools" title="Map tools">☰</summary><div class="menu"><button id="levelEdit" hidden aria-pressed="false">Custom Triggers</button><button id="allOn">Show all objects</button><button id="allOff">Hide all objects</button><button id="undoWall">Undo hidden wall</button><button id="showWalls">Show all walls</button><button id="reset">↺ Reset</button></div></details></header>
<aside id="sidebar"><input id="search" type="search" placeholder="Find label, victim, script…" aria-label="Search entities"><div id="categories"></div><div id="objects"></div><div class="listtools"><span id="count"></span></div><select id="zoneSelect" aria-label="Named room or zone"><option value="">Rooms / zones</option></select><button id="openTable" class="entityTableButton">↗ Entity table</button></aside>
<main id="view"><canvas id="mapCanvas" aria-label="Interactive map" tabindex="0"></canvas><div id="webgl"></div><canvas id="overlay"></canvas><div id="tooltip" hidden></div><div id="error" hidden></div><div id="loading" hidden>…</div><div id="zoom"><button id="zoomIn" aria-label="Zoom in">＋</button><button id="zoomOut" aria-label="Zoom out">−</button></div><div id="surfaceTools" hidden><span>Right-click a surface to hide</span><button id="surfaceUndo" aria-label="Undo hidden surface" title="Undo last hidden surface · Ctrl/⌘ Z" disabled>↶ Undo</button><span id="surfaceCount" role="status" aria-live="polite"></span><label class="collisionToggle" title="Blocking BSP geometry in red · follows brush motion previews"><input id="collisions" type="checkbox">Collisions<span id="collisionState" role="status" aria-live="polite"></span></label><label class="triggerBoundsToggle" title="Show/hide all authored trigger bounding boxes"><input id="triggerBounds" type="checkbox">Triggers</label><label class="textureToggle" title="Original map textures with neutral lighting"><input id="textures" type="checkbox">Textures<span id="textureState" role="status" aria-live="polite"></span></label><details id="extraVolumeMenu"><summary>More volumes</summary><div class="volumeMenu"><label title="Original victim actors and skins at authored spawn candidates; poses only"><input id="victimModels" type="checkbox">Victim models<span id="victimState" role="status"></span></label><label title="Victim pickup boxes at authored spawn candidates"><input id="pickupVolumes" type="checkbox">Victim pickup boxes</label><label title="Authored bounds of all linked animated brush models"><input id="brushVolumes" type="checkbox">Brush bounds</label><div class="volumeConnections"><button id="radii" aria-pressed="false">◎ Roam guides</button><button id="targetLinks" aria-pressed="false" title="Trigger-to-target actions; select an object to isolate its connections">↗ Trigger / target connections</button><button id="links" aria-pressed="false">⌁ Spawn connections</button></div></div></details><details id="sliceMenu"><summary>Slice tools</summary><div id="height"><label title="Filter map geometry and objects by their original Y height"><span>Y</span><input id="heightLow" aria-label="Minimum height" type="range"><input id="heightHigh" aria-label="Maximum height" type="range"><output id="heightValue"></output></label><button id="heightReset" title="All heights" aria-label="Reset height filter">↺</button><label class="roof" title="Hide downward-facing surfaces in 3D"><input id="roof" type="checkbox" checked>Cut roof</label></div></details></div><div id="flightHint" hidden><span id="orbitControlsHint"><b>Orbit controls</b> · Left-drag rotate · Right-drag pan · Scroll zoom · F to fly</span><span id="flyControlsHint" hidden><b>Fly controls</b> · WASD move · Drag / arrows look · Q down / E up · Shift faster · Scroll speed · F / Esc exit</span><label id="flightSpeedControl" hidden title="Shared across all maps; scroll in Fly also changes speed">Speed<input id="flightSpeed" aria-label="Fly speed" type="range" min="100" max="3000" step="20" value="600"><output id="flightSpeedValue">600 u/s</output></label><button id="flightSpeedReset" hidden aria-label="Reset fly speed" title="Reset speed to 600 units/second">↺</button></div><div id="status"><span id="coords">X — · Z —</span><span id="scale"></span><span id="measureStatus"></span></div></main>
<aside id="inspector" hidden><div class="inspectTop"><span id="selectedLabel"></span><button id="closeInspect" aria-label="Close details">×</button></div><div id="details"></div></aside></div>
<div id="motionControls" class="motionControls" hidden><input id="animationEnabled" type="checkbox" hidden><button id="animationPlay" title="Play / pause motion" disabled hidden>▶</button><button id="animationReset" title="Restore authored pose">↺</button><input id="animationTime" type="range" min="0" max="1" step=".001" value="0" aria-label="Motion timeline"><output id="animationValue">0 s</output></div>
<dialog id="tableDialog"><div class="tableToolbar"><input id="tableSearch" type="search" aria-label="Search entity table" placeholder="Search table…"><span id="tableCount"></span><button id="closeTable" aria-label="Close entity table">×</button></div><div class="tableScroll"><table><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table></div></dialog>
<dialog id="scriptDialog"><div class="tableToolbar"><b id="scriptTitle"></b><span class="spacer"></span><button id="closeScript" aria-label="Close script explanation">×</button></div><div id="scriptBody" class="scriptBody"></div></dialog>
<script type="module" src="app.js"></script></body></html>
